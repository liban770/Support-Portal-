{% extends "base_public.html" %}
{% block title %}403 Forbidden{% endblock %}
{% block content %}
<div class="card shadow-float overflow-hidden text-center">
  <div class="h-1.5 bg-error"></div>
  <div class="p-8 sm:p-10 space-y-3">
    <span class="mx-auto w-16 h-16 rounded-2xl bg-error-container text-error flex items-center justify-center">
      <span class="material-symbols-outlined text-[32px]">shield_locked</span>
    </span>
    <h1 class="font-headline-lg text-headline-lg text-on-surface">403 — Access Forbidden</h1>
    <p class="font-body-md text-body-md text-secondary">
      {{ reason|default:"You do not have the required permissions or role scope to access this institutional resource." }}
    </p>
    <div class="pt-4">
      <a href="{% url 'core:dashboard' %}" class="btn-primary w-full">Return to Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
