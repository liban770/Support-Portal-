{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Portal{% endblock %} · {{ site.portal_name|default:"ATU Support Portal" }}</title>
<meta name="description" content="{% block meta_description %}Abaarso Tech University Student Support Portal — submit, track and resolve student requests.{% endblock %}">
<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script src="{% static 'js/tailwind.config.js' %}"></script>
<style type="text/tailwindcss">{% include "partials/components.css" %}</style>
<link rel="stylesheet" href="{% static 'css/app.css' %}">
{% block head %}{% endblock %}
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
{% block body %}{% endblock %}
<script src="{% static 'js/app.js' %}" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
