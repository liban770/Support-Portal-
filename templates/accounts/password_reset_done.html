{% extends "base_public.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="card shadow-float p-8 sm:p-10 text-center">
  <span class="mx-auto w-16 h-16 rounded-2xl bg-[#DCFCE7] text-[#166534] flex items-center justify-center"><span class="material-symbols-outlined text-[32px]">mark_email_read</span></span>
  <h1 class="mt-5 font-headline-lg text-headline-lg">Check your email</h1>
  <p class="mt-2 font-body-md text-body-md text-secondary">If an active account matches that address, a password reset link has been sent. The link expires after a short time.</p>
  <a href="{% url 'accounts:login' %}" class="btn-secondary w-full mt-6">Back to sign in</a>
</div>
{% endblock %}
